name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      debug:
        description: "Skip build, only validate secrets"
        type: boolean
        default: false
      version:
        description: "Override version (workflow_dispatch only; tag builds read from tag name)"
        type: string
        default: ""

env:
  # R2 is the primary download host (Cloudflare edge, fast in China, no
  # unauthenticated rate limit). CI uploads the APK + update.json here
  # on every tag push, and the web /my + /download pages + the Tauri
  # auto-updater all read from these URLs. GitHub Releases is still
  # updated as a mirror for non-CN users / history.
  R2_PUBLIC: https://r2.lelexue.cn
  R2_BUCKET: holy
  R2_ENDPOINT: https://76f91d4a19eb310b8a1eee846a8d807b.r2.cloudflarestorage.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Debug: validate all secrets before spending time on build ──
      - name: Validate keystore secret
        env:
          TEST_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ALL_OK=true
          for entry in \
            "ANDROID_KEYSTORE_B64|TEST_KEYSTORE_B64" \
            "KEYSTORE_PASSWORD|TEST_KEYSTORE_PASSWORD"; do
            NAME="${entry%%|*}"
            VAR="${entry##*|}"
            VAL="${!VAR}"
            if [ -z "$VAL" ]; then
              echo "::error::$NAME → EMPTY (not set in GitHub Secrets)"
              ALL_OK=false
            else
              echo "✅ $NAME → ${#VAL} chars"
            fi
          done
          if [ "$ALL_OK" = false ]; then
            echo "::error::Some secrets are missing. Fix them before running the build."
            exit 1
          fi
          echo "Keystore secrets are properly configured!"

      # ── Debug mode: stop here if debug=true ──
      - name: Stop early in debug mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        run: |
          echo "🧪 Debug mode enabled. Build skipped."
          echo "All secrets validated successfully. Exiting early."
          exit 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: "gradle" # Cache Gradle dependencies for faster builds

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        # Re-uses src-tauri/target and ~/.cargo/registry across runs.
        # Cuts ~5-10 min off repeat builds (Rust compilation is the
        # biggest single cost in the Android pipeline). Keyed off the
        # Cargo.lock hash so we don't serve stale binaries when deps
        # change.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/target -> .rust-cache
          shared-key: ${{ runner.os }}-android

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p src-tauri/gen/android
            echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/keystore.jks
          fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        id: version
        run: |
          # Tag push: read version from tag name (strip leading 'v').
          # workflow_dispatch: use input.version override, or fall back
          # to 0.0.0-<run_number> for ad-hoc builds.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Patching tauri.conf.json to version ${VERSION}"
          # Use a uniquely-named tmp file — GH Actions runners have a real
          # 'tmp' directory at the workspace root that would shadow a
          # bare 'tmp' filename.
          TMPFILE=$(mktemp "${RUNNER_TEMP}/tauri-conf.XXXXXX.json")
          jq --arg v "${VERSION}" '.version = $v' src-tauri/tauri.conf.json > "$TMPFILE"
          mv "$TMPFILE" src-tauri/tauri.conf.json
          echo "Patched version: $(jq -r '.version' src-tauri/tauri.conf.json)"

      - name: Build Android APK
        env:
          # SvelteKit $env/static/public reads PUBLIC_* at build time.
          # Music / parquet / book data on R2 is still served from R2.
          PUBLIC_R2: ${{ env.R2_PUBLIC }}
          # Absolute path ensures Gradle finds the keystore regardless of working directory
          KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        # The `src-tauri/gen/android/` directory is committed to the repo,
        # including custom MainActivity.kt / themes.xml / colors.xml.
        # No need to run `tauri android init` (it would regenerate template files).
        # `tauri android build` uses the existing project files as-is.
        run: |
          bunx tauri android build --target aarch64

      - name: Sign APK if unsigned
        run: |
          KEYSTORE="${{ github.workspace }}/src-tauri/gen/android/keystore.jks"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Keystore not found; APK will remain unsigned."
            exit 0
          fi

          # Check if the built APK is unsigned
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*unsigned*.apk" -type f | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No unsigned APK found; assuming it's already signed."
            exit 0
          fi

          echo "Found unsigned APK: $UNSIGNED_APK"
          SIGNED_APK="${UNSIGNED_APK//-unsigned/}"

          # Find apksigner from Android SDK
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            # Try build-tools path directly
            APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          fi

          echo "Using apksigner: $APKSIGNER"
          echo "Signing APK..."

          "$APKSIGNER" sign --ks "$KEYSTORE" \
            --ks-key-alias upload \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          # Verify signature
          "$APKSIGNER" verify "$SIGNED_APK"
          echo "APK signed successfully: $SIGNED_APK"

      - name: Locate and prepare APK
        id: prepare
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"

          # Prefer signed APK (without "unsigned" in name)
          APK=$(find src-tauri/gen/android -name "*.apk" -type f ! -name "*unsigned*" ! -name "*unaligned*" | head -1)

          # Fall back to unsigned APK if no signed one found
          if [ -z "$APK" ]; then
            echo "Warning: No signed APK found, falling back to unsigned."
            APK=$(find src-tauri/gen/android -name "*.apk" -type f ! -name "*unaligned*" | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "Error: No APK found after build."
            exit 1
          fi

          echo "Found APK at: $APK"
          # Versioned name for the GitHub Release asset
          cp "$APK" "dist/stone-${VERSION}.apk"
          # Stable name for fallback artifact uploads
          cp "$APK" dist/stone.apk
          echo "apk_path=dist/stone-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest
        env:
          R2_PUBLIC: ${{ env.R2_PUBLIC }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="Build $VERSION from ${{ github.sha }}"
          bash scripts/update/generate-manifest.sh "${VERSION}" "${NOTES}" "${{ steps.prepare.outputs.apk_path }}"
          cp update.json dist/update.json

      # ── Primary download host: Cloudflare R2 ──
      # This is what /my, /download and the Tauri auto-updater read.
      # R2 is the canonical source because:
      #   1. Cloudflare edge is fast in China (no slow github.com hop)
      #   2. No unauthenticated rate limit (apk ~12MB hits would 403
      #      from api.github.com/repos/.../releases/latest after 60/hr)
      # GitHub Release upload (next step) still runs as a mirror.
      - name: Upload APK + manifest to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Secret R2_ACCESS_KEY is empty. Add it in repo Settings → Secrets."
            exit 1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Secret R2_SECRET_KEY is empty. Add it in repo Settings → Secrets."
            exit 1
          fi

          # Versioned APK (preserved for history / GitHub Release mirror)
          aws s3 cp "dist/stone-${{ steps.version.outputs.version }}.apk" \
            "s3://${{ env.R2_BUCKET }}/apk/stone-${{ steps.version.outputs.version }}.apk" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --content-type "application/vnd.android.package-archive"

          # Always-latest pointer — every download path (auto-updater,
          # /my page, /download page) resolves to this URL.
          aws s3 cp "dist/stone-${{ steps.version.outputs.version }}.apk" \
            "s3://${{ env.R2_BUCKET }}/apk/stone-latest.apk" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --content-type "application/vnd.android.package-archive"

          # Updater manifest — Tauri auto-updater reads this directly.
          aws s3 cp dist/update.json \
            "s3://${{ env.R2_BUCKET }}/apk/update.json" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --content-type "application/json"

          echo ""
          echo "R2 upload complete."
          echo "  APK:        ${{ env.R2_PUBLIC }}/apk/stone-latest.apk"
          echo "  Manifest:   ${{ env.R2_PUBLIC }}/apk/update.json"

      - name: Upload APK + manifest to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        # Use `gh release create` (rather than softprops/action-gh-release)
        # because the repo's GITHUB_TOKEN doesn't grant third-party
        # actions permission to manage releases (403 "Resource not
        # accessible by integration"). `gh` ships with the runner and
        # inherits the same token, so the permission model is consistent.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # --generate-notes: GitHub auto-generates a changelog from
          # commits since the last tag. --fail-on-no-commits keeps it
          # quiet on the first release.
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            "dist/stone-${VERSION}.apk" \
            "dist/update.json"

      - name: Upload artifact fallback
        # Always run if the file exists to help debugging if Release upload fails
        if: always() && hashFiles('dist/stone.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stone-apk-${{ steps.version.outputs.version }}
          path: |
            dist/stone.apk
            dist/update.json
