name: Build macOS

# Run on tag push (release) or manual dispatch (debug).
# Tag-driven path: produces a universal-apple-darwin .dmg and uploads
# it to the GitHub Release alongside the Android APK.
# See docs/release-pipeline-plan.md for the full design.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      debug:
        description: "Skip build, only validate environment"
        type: boolean
        default: false
      version:
        description: "Override version (workflow_dispatch only; tag builds read from tag name)"
        type: string
        default: ""

env:
  # R2 is the primary download host — the web /my and /download pages
  # resolve the macOS asset URL from R2's apk/stone-latest.dmg. CI
  # uploads here on every tag push so the latest pointer is always
  # current. GitHub Release (later step) still runs as a mirror.
  R2_PUBLIC: https://r2.lelexue.cn
  R2_BUCKET: holy
  R2_ENDPOINT: https://76f91d4a19eb310b8a1eee846a8d807b.r2.cloudflarestorage.com

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop early in debug mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        run: |
          echo "🧪 Debug mode enabled. Build skipped."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS x86_64 target
        # universal-apple-darwin bundles both x86_64 and aarch64. The
        # macOS runner image ships with aarch64-apple-darwin only.
        run: rustup target add x86_64-apple-darwin

      # Cache `target/` to keep rebuilds under 10 minutes.
      # macOS runners share /Users/runner but ${{ runner.temp }} is per-job.
      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/target -> .rust-cache
          shared-key: ${{ runner.os }}-mac

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Patching tauri.conf.json to version ${VERSION}"
          # Use a uniquely-named tmp file — GH Actions runners have a real
          # 'tmp' directory at the workspace root that would shadow a
          # bare 'tmp' filename.
          TMPFILE=$(mktemp "${RUNNER_TEMP}/tauri-conf.XXXXXX.json")
          jq --arg v "${VERSION}" '.version = $v' src-tauri/tauri.conf.json > "$TMPFILE"
          mv "$TMPFILE" src-tauri/tauri.conf.json
          echo "Patched version: $(jq -r '.version' src-tauri/tauri.conf.json)"

      - name: Build macOS (universal)
        env:
          # SvelteKit $env/static/public reads PUBLIC_* at build time.
          # Music / parquet / book data on R2 is still served from R2.
          PUBLIC_R2: ${{ env.R2_PUBLIC }}
        # universal-apple-darwin ships both x86_64 and aarch64 in one
        # binary. The bundle produces .app + .dmg; we ship the .dmg.
        run: |
          bunx tauri build --target universal-apple-darwin

      - name: Locate and prepare DMG
        id: prepare
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"

          # Tauri 2 puts the .dmg under
          # src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          DMG=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "Error: No .dmg found after build."
            ls -la src-tauri/target/universal-apple-darwin/release/bundle/ 2>&1 || true
            exit 1
          fi

          echo "Found DMG at: $DMG"
          cp "$DMG" "dist/stone-${VERSION}.dmg"
          echo "dmg_path=dist/stone-${VERSION}.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to Cloudflare R2
        if: success()
        # R2 is the primary download host (Cloudflare edge, fast in
        # China, no rate limit). The android workflow writes
        # `apk/stone-latest.apk` + `apk/update.json`; this step writes
        # the DMG half. If android's update.json is already in R2, we
        # merge the DMG entry in (so /my + /download can show both
        # platforms with sizes); otherwise we write a fresh manifest
        # with just the DMG.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_PUBLIC: ${{ env.R2_PUBLIC }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 secrets missing; skipping R2 upload."
            exit 1
          fi

          DMG_PATH="${{ steps.prepare.outputs.dmg_path }}"
          DMG_SIZE=$(stat -c%s "$DMG_PATH" 2>/dev/null || stat -f%z "$DMG_PATH" 2>/dev/null || wc -c < "$DMG_PATH" | tr -d ' ')
          echo "DMG size: $DMG_SIZE bytes"

          # Versioned DMG (preserved for history / GitHub Release mirror)
          aws s3 cp "$DMG_PATH" \
            "s3://${{ env.R2_BUCKET }}/apk/stone-${{ steps.version.outputs.version }}.dmg" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --content-type "application/x-apple-diskimage"

          # Always-latest DMG pointer
          aws s3 cp "$DMG_PATH" \
            "s3://${{ env.R2_BUCKET }}/apk/stone-latest.dmg" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --content-type "application/x-apple-diskimage"

          # Merge DMG entry into the existing update.json (written by
          # android job) so /my + /download show both platforms with
          # their real sizes.
          if aws s3 cp "s3://${{ env.R2_BUCKET }}/apk/update.json" /tmp/update-existing.json \
              --endpoint-url "${{ env.R2_ENDPOINT }}" --region auto 2>/dev/null; then
            echo "Existing update.json found, merging DMG entry."
            jq --argjson sz "$DMG_SIZE" \
              '.platforms["darwin-universal"] = {url: "https://r2.lelexue.cn/apk/stone-latest.dmg", size: $sz, signature: ""}' \
              /tmp/update-existing.json > /tmp/update-merged.json
            aws s3 cp /tmp/update-merged.json \
              "s3://${{ env.R2_BUCKET }}/apk/update.json" \
              --endpoint-url "${{ env.R2_ENDPOINT }}" \
              --region auto \
              --content-type "application/json"
          else
            echo "No existing update.json, generating fresh one with just DMG."
            bash scripts/update/generate-manifest.sh \
              "${{ steps.version.outputs.version }}" \
              "Build ${{ steps.version.outputs.version }} from ${{ github.sha }}" \
              "" \
              "$DMG_PATH"
            aws s3 cp update.json \
              "s3://${{ env.R2_BUCKET }}/apk/update.json" \
              --endpoint-url "${{ env.R2_ENDPOINT }}" \
              --region auto \
              --content-type "application/json"
          fi

          echo ""
          echo "R2 upload complete."
          echo "  DMG:        ${{ env.R2_PUBLIC }}/apk/stone-latest.dmg"

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        # GitHub Release is the mirror (R2 is the primary download
        # source). The android workflow creates the Release first
        # (gh release create). We wait for it, then attach our DMG.
        # `gh release upload` is idempotent for the same filename.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Wait up to 30 min for the release to exist (android job
          # runs in parallel and usually finishes first).
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists, uploading DMG."
              break
            fi
            echo "  [$i/60] release not yet created, waiting 30s..."
            sleep 30
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG not created after 30 min. Android build likely failed."
            exit 1
          fi
          gh release upload "$TAG" "${{ steps.prepare.outputs.dmg_path }}" --clobber

      - name: Upload artifact fallback
        if: always() && hashFiles('dist/*.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stone-dmg-${{ steps.version.outputs.version }}
          path: dist/*.dmg
