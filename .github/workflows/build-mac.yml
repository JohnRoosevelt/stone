name: Build macOS

# Run on tag push (release) or manual dispatch (debug).
# Tag-driven path: produces a universal-apple-darwin .dmg and uploads
# it to the GitHub Release alongside the Android APK.
# See docs/release-pipeline-plan.md for the full design.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      debug:
        description: "Skip build, only validate environment"
        type: boolean
        default: false
      version:
        description: "Override version (workflow_dispatch only; tag builds read from tag name)"
        type: string
        default: ""

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop early in debug mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        run: |
          echo "🧪 Debug mode enabled. Build skipped."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache `target/` to keep rebuilds under 10 minutes.
      # macOS runners share /Users/runner but ${{ runner.temp }} is per-job.
      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Patching tauri.conf.json to version ${VERSION}"
          jq --arg v "${VERSION}" '.version = $v' src-tauri/tauri.conf.json > tmp
          mv tmp src-tauri/tauri.conf.json
          echo "Patched version: $(jq -r '.version' src-tauri/tauri.conf.json)"

      - name: Build macOS (universal)
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        # universal-apple-darwin ships both x86_64 and aarch64 in one
        # binary. The bundle produces .app + .dmg; we ship the .dmg.
        run: |
          bunx tauri build --target universal-apple-darwin

      - name: Locate and prepare DMG
        id: prepare
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"

          # Tauri 2 puts the .dmg under
          # src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          DMG=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "Error: No .dmg found after build."
            ls -la src-tauri/target/universal-apple-darwin/release/bundle/ 2>&1 || true
            exit 1
          fi

          echo "Found DMG at: $DMG"
          cp "$DMG" "dist/stone-${VERSION}.dmg"
          echo "dmg_path=dist/stone-${VERSION}.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.prepare.outputs.dmg_path }}

      - name: Upload artifact fallback
        if: always() && hashFiles('dist/*.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stone-dmg-${{ steps.version.outputs.version }}
          path: dist/*.dmg
