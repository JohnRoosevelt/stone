name = "stone"
compatibility_date = "2024-04-01"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_flags = [ "nodejs_compat" ]


[vars]
# PUBLIC_* — vite 静态替换到 client bundle (跟 .env 同步维护)
PUBLIC_R2 = "https://r2.lelexue.cn"
PUBLIC_API_BASE = "https://lelexue.cn"
# R2 凭据 (accountId,accessKeyId,secretAccessKey,bucket 4 段逗号分隔)
# 严禁进 wrangler.toml 跟 git — 走 CF Pages Secret (prod) / .dev.vars (dev)

[[d1_databases]]
binding = "DB"
database_name = "stone-db"
database_id = "8aa5dbac-b20e-47dd-96af-79a493e5638f"

# KV bindings — dev 走 miniflare 本地 path (`.wrangler/state/v3/kv/`),
# prod 走 CF 远端 namespace（id 在 deploy 时由 wrangler 注入）。
# 每次新环境需要 `wrangler kv namespace create` 拿 id（需要 CF API token）。
[[kv_namespaces]]
# Binding 名跟 CF Pages dashboard STONE_SEARCH_CACHE 1:1 对齐,
# id 是 2026-05-15 commit 9a7fa81 / 95458c8 / d512ecc / b0a94af / a4c0ac3
# 一直用的 namespace. d5f28c4 改成 SEARCH_CACHE + 占位符 id 跟 dashboard
# 冲突, CF Pages deploy 报 8000022 "Invalid KV namespace ID".
binding = "STONE_SEARCH_CACHE"
id = "a47185b8d89f47e89e85f4a981e2ae13"
preview_id = "472b3327834b4c3a8243ea31e6e40b5f"
