<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1B2120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Stone" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph (WeChat, Facebook, Twitter, etc.) -->
    <meta property="og:title" content="Stone - 脚前的灯" />
    <meta property="og:description" content="A Bible reading app" />
    <meta property="og:image" content="/png/pwa-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stone" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Stone - 脚前的灯" />
    <meta name="twitter:description" content="A Bible reading app" />
    <meta name="twitter:image" content="/png/pwa-512.png" />
    %unocss-svelte-scoped.global%
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
